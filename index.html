<script>

else if(t.type=='RESERVE'){p.res+=t.kg;p.cust[t.party]=(p.cust[t.party]||0)+t.kg}
else if(t.type=='UNRESERVE'){p.res-=t.kg;p.cust[t.party]=(p.cust[t.party]||0)-t.kg}
else if(t.type=='TRANSFER')p.loc=t.to;
if(t.ts>p.last)p.last=t.ts})}
const LAB=l=>`${l.product} ${l.grade||''}`.replace(/\s+/g,' ').trim()+' | '+l.th+'MMx'+l.w+'MM'+(l.l?'x'+l.l+'MM':' (coil)')+' | '+l.make+((l.form||'')=='CTL'?' CTL':'');

status:p.phys<0?'NEGATIVE':p.phys==0?'Dispatched':p.res>0&&avail<=0?'Reserved':p.res>0?'Part-reserved':'Available'}})}

function res(lot,party,kg,ago){T('RESERVE',lot,kg,{party,ts:ago?NOW-ago*D:0});pos()}
function disp(lot,party,kg,ago){const o={party,ts:ago?NOW-ago*D:0,ref:'INV-'+pad(S.tx.length+1,4)};const rc=(P[lot].cust[party]||0);if(rc>0)T('UNRESERVE',lot,Math.min(kg,rc),o);T('DISPATCH',lot,kg,o);pos()}
function boot(){if(SG.url&&SG.key)return initCloud();try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)demo();S.off=S.off||{};S.jw=S.jw||[];S.prod=S.prod||['CR','HR','HR CQ','HRPO','GP/GI','GA','Other'];pos();nav();mode()}
const TABS=[['mgmt','Management'],['stock','Stock'],['find','What do I have?'],['inward','Inward'],['move','Reserve / Dispatch / Transfer'],['proc','Processing'],['recon','Reconcile'],['age','Ageing & Valuation'],['alerts','Alerts'],['ledger','Ledger & Audit'],['master','Masters']];

function view(){pos();el('main').innerHTML=({mgmt,stock,find,inward,move,proc,recon,age,alerts:alertsV,ledger,master,open:openV,jw:jwV,cond:condV,jo:joV})[tab]()}
function opt(a,s){return a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('')}
const LP={};
function lotOpt(rows){return rows.map((r,i)=>`<option value="${r.id}"${i?'':' selected'}>${r.id} | ${r.lab}${r.cond!='Prime'?' | '+r.cond.toUpperCase():''}${r.own=='Jobwork'?' | JOBWORK '+r.owner:''}${r.outw?' | AT '+r.outw.toUpperCase():''}${(r.bundle||r.coil)?' | '+(r.bundle||r.coil):''} | avail ${r.avail} kg</option>`).join('')}
function lotSel(id,rows,on){LP[id]=rows;return `<input id="${id}_q" placeholder="Type to search, e.g. CR 1.2 Tata, L014, rusted" oninput="lotF('${id}')" style="width:100%;margin-bottom:4px"><select id="${id}" size="7" style="width:100%" ${on?'onchange="'+on+'"':''}>${lotOpt(rows)}</select><small id="${id}_n"></small>`}

function alerts(){const out=[],r=RO();const bs={};r.forEach(x=>{if(x.bundle&&x.phys>0)bs[x.bundle]=(bs[x.bundle]||0)+1});
r.forEach(x=>{const w=(s,m)=>out.push({s,m:`${x.id} | ${x.lab}: ${m}`,id:x.id});
if(x.phys<0)w('hi','NEGATIVE stock '+x.phys+' kg');if(x.res>x.phys&&x.phys>=0)w('hi','reserved exceeds physical');
if(!x.supplier)w('md','missing supplier');if(!x.loc)w('md','missing location');if(!x.cost||x.cost<=0)w('md','missing purchase cost');
if(x.cost&&(x.cost<30||x.cost>150))w('md','unusual price ₹'+x.cost.toFixed(1)+'/kg');
if(x.bundle&&bs[x.bundle]>1)w('hi','duplicate bundle ID '+x.bundle);
if(x.phys>0&&x.outw&&x.outd){const d=Math.floor((NOW-x.outd)/D);if(d>15)w(d>30?'hi':'md','out with '+x.outw+' for '+d+' days')}if(x.phys>0){if(x.age>180)w('hi','very old stock ('+x.age+' d)');else if(x.age>90)w('md','old stock ('+x.age+' d)');
if(x.idle>=60)w('md','no movement for '+x.idle+' d, '+inr(x.val)+' locked');if(x.phys<25)w('md','tiny residual '+x.phys+' kg');
if(x.res==0&&x.type=='bundle'&&x.idle>30)w('md','unallocated and idle')}});
const tot={};r.filter(x=>x.type=='bundle').forEach(x=>tot[x.product]=(tot[x.product]||0)+x.phys);
Object.entries(S.min).forEach(([p,m])=>{if(m>0&&(tot[p]||0)<m*1000)out.push({s:'md',m:`LOW STOCK ${p}: ${mt(tot[p]||0)} MT < min ${m} MT`})});
S.jobs.forEach(j=>{if(j.lossPct>(j.thr||1))out.push({s:'hi',m:`${j.job}: unaccounted loss ${j.lossPct.toFixed(2)}% (${j.loss} kg)`})});
S.audit.filter(a=>a.act=='Override').forEach(a=>out.push({s:'md',m:'Negative-stock override logged on '+a.obj+': '+a.why}));
return out}
function KPI(label,val,pred,bad){return `<div class="k ${bad?'bad':''}" onclick='drillK(${JSON.stringify(pred)},${JSON.stringify(label)})'><small>${label}</small><b>${val}</b></div>`}
function drillK(p,l){F={q:'',pred:p,label:l};go('stock')}
const PRED={all:'phys>0',a30:'phys>0&&age>30',a60:'phys>0&&age>60',a90:'phys>0&&age>90',a180:'phys>0&&age>180',bad:'phys<=0&&status=="NEGATIVE"',att:'ATT'};
let G={cond:'',form:'',prod:'',th:'',make:'',grade:'',loc:'',per:30,m:'val'};
const GM=[['cond','cond'],['form','form'],['prod','product'],['th','th'],['make','make'],['grade','grade'],['loc','loc']];
const SEC=[['OVERVIEW',[['mgmt','Dashboard']]],['INVENTORY',[['stock','Stock'],['find','What Do I Have?'],['jw','Jobwork Material (customer-owned)'],['jo','Out with Job Workers']]],['TRANSACTIONS',[['inward','Add Purchase'],['move','Dispatch / Reserve / Transfer'],['recon','Stock Correction'],['cond','Mark Rusted / Damaged'],['open','Opening Stock (paste from Excel)']]],['ANALYSIS',[['age','Ageing & Valuation'],['alerts','Needs Attention']]],['ADMIN',[['master','Items & Customers'],['ledger','Stock Movements & Audit'],['proc','Processing']]]];
function nav(){el('nav').innerHTML='<div class="brand">Satguru Steels<small style="display:block;font-weight:400;font-size:11px;color:var(--m)">Build '+BUILD+'</small></div>'+SEC.filter(([h])=>!(cloud&&role=='management'&&h=='TRANSACTIONS')).map(([h,a])=>`<div class="sh">${h}</div>`+a.map(([k,n])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${n}${k=='alerts'?' ('+alerts().length+')':''}</button>`).join('')).join('');view()}
const gp=()=>GM.map(([g,k])=>G[g]?`&&String(r.${k})==${JSON.stringify(String(G[g]))}`:'').join('');
const gOk=x=>GM.every(([g,k])=>!G[g]||String(x[k])==String(G[g]));
function ser(){const N=G.per>30?30:Math.max(G.per,7),span=G.per*D,st=NOW-span,C={};S.lots.forEach(l=>{if(gOk({...l,form:l.form||'Full sheet',cond:l.cond||'Prime'})&&l.own!='Jobwork')C[l.id]=l.cost});
const inn=Array(N).fill(0),out=Array(N).fill(0),dl=Array(N).fill(0),dv=Array(N).fill(0);let o=0,ov=0;
S.tx.forEach(t=>{const c=C[t.lot];if(c===undefined)return;if(t.type.startsWith('RECLASS')&&!G.cond)return;const s=PIN.includes(t.type)?1:POUT.includes(t.type)?-1:0;if(!s)return;if(t.ts<st){o+=s*t.kg;ov+=s*t.kg*c;return}
const i=Math.min(N-1,Math.floor((t.ts-st)/span*N));const pc=t.type.startsWith('PROC');if(s>0){if(!pc)inn[i]+=t.kg}else{if(!pc)out[i]+=t.kg}dl[i]+=s*t.kg;dv[i]+=s*t.kg*c});
let a=o,b=ov;return{inn,out,cl:dl.map(x=>a+=x),cv:dv.map(x=>b+=x),o,ov}}
function plot(inn,out,cl,col){const W=560,H=150,N=cl.length,bw=W/N,mx=Math.max(1,...(inn||[]),...(out||[])),mc=Math.max(1,...cl),mn=inn?0:Math.min(...cl)*.9,y=(x,a,b)=>H-8-(x-a)/((b-a)||1)*(H-20);
let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
if(inn)for(let i=0;i<N;i++)s+=`<rect x="${i*bw+1}" width="${bw/2-1}" y="${y(inn[i],0,mx)}" height="${H-8-y(inn[i],0,mx)}" fill="var(--g)" opacity=".75"/><rect x="${i*bw+bw/2}" width="${bw/2-1}" y="${y(out[i],0,mx)}" height="${H-8-y(out[i],0,mx)}" fill="var(--r)" opacity=".75"/>`;

function capBar(key,gk,title){const g={};gR().forEach(r=>{const k=String(r[key]);g[k]=g[k]||{kg:0,val:0};g[k].kg+=r.phys;g[k].val+=r.val});
const e=Object.entries(g).sort((a,b)=>b[1][G.m=='val'?'val':'kg']-a[1][G.m=='val'?'val':'kg']),T=e.reduce((s,x)=>s+x[1].val,0),mx=Math.max(...e.map(x=>x[1][G.m=='val'?'val':'kg']),1);

const RO=()=>R().filter(x=>x.own!='Jobwork');

const lvl=m=>/NEGATIVE|exceeds|duplicate/i.test(m)?0:/very old|unaccounted|locked|Override/i.test(m)?1:2;
function mgmt(){const A=RO(),rows=gR(),kg=rows.reduce((a,x)=>a+x.phys,0),val=rows.reduce((a,x)=>a+x.val,0),rs=rows.reduce((a,x)=>a+x.res,0);
const o90=rows.filter(x=>x.age>90).reduce((a,x)=>a+x.phys,0),slow=rows.filter(x=>x.idle>=60).reduce((a,x)=>a+x.val,0),ex=gp();

T(d>0?'ADJ_IN':'ADJ_OUT',x.id,Math.abs(d),{rem:v('r_r')});A('Adjust',x.id,x.phys,p,v('r_r')+' ('+inr(d*x.cost)+')');save();pos();toast('Adjusted '+d+' kg');view()}
const BK=[[0,15],[16,30],[31,60],[61,90],[91,180],[181,365],[366,1e9]];
function age(){const r=RO().filter(x=>x.phys>0),tot=r.reduce((a,x)=>a+x.val,0),kg=r.reduce((a,x)=>a+x.phys,0);
const wac={};r.forEach(x=>{wac[x.sku]=wac[x.sku]||{lab:x.lab,kg:0,v:0};wac[x.sku].kg+=x.phys;wac[x.sku].v+=x.val});
const sell=r.reduce((a,x)=>a+x.sellv,0);
return `<h2>Ageing</h2><div class="card w"><table><tr><th>Bucket<th class=n>MT<th class=n>Cost ₹<th class=n>% value</tr>${BK.map(([a,b])=>{const z=r.filter(x=>x.age>=a&&x.age<=b);const vv=z.reduce((s,x)=>s+x.val,0);return `<tr class="cl" onclick='drillK(${JSON.stringify("phys>0&&age>="+a+"&&age<="+b)},"Age ${a}-${b>1e8?"+":b}")'><td>${a}–${b>1e8?'∞':b} d<td class=n>${mt(z.reduce((s,x)=>s+x.phys,0))}<td class=n>${inr(vv)}<td class=n>${tot?(vv/tot*100).toFixed(1):0}%</tr>`}).join('')}</table></div>
<div class="card"><h2>Oldest stock</h2>${[...r].sort((a,b)=>b.age-a.age).slice(0,8).map(x=>`<div>${x.id} | ${x.lab} · ${x.age} d · ${mt(x.phys)} MT · ${inr(x.val)}</div>`).join('')}</div>

<div class="card w"><table><tr><th>SKU<th class=n>MT<th class=n>Cost ₹<th class=n>WAC ₹/kg<th>Cost layers (oldest first)</tr>${Object.entries(wac).map(([s,o])=>`<tr><td>${o.lab}<td class=n>${mt(o.kg)}<td class=n>${inr(o.v)}<td class=n>${(o.v/o.kg).toFixed(2)}<td>${r.filter(x=>x.sku==s).sort((a,b)=>a.date-b.date).map(x=>mt(x.phys)+' MT @ ₹'+x.cost.toFixed(2)).join(' · ')}</tr>`).join('')}</table></div>`}

const act=k=>S[k].filter(x=>!S.off[k+':'+x]);
function revTx(id,why){if(me=='Sales'||(cloud&&role=='management'))return toast('Your role cannot reverse entries',1),false;const t=S.tx.find(x=>x.id==id);if(!t)return false;
if(S.tx.some(x=>x.rev==id))return toast('Already reversed',1),false;if(t.rev)return toast('A reversal cannot be reversed; post a new entry',1),false;
if(!why)return toast('Enter a reason first',1),false;if(['PROC_IN','PROC_OUT','RECLASS_IN','RECLASS_OUT'].includes(t.type))return toast('Processing and condition entries cannot be reversed. To undo a condition tag, move the stock back to Prime on the Mark Rusted / Damaged page',1),false;
const p=P[t.lot],o={party:t.party,ref:t.ref,rev:id,rem:'Reversal of '+id+': '+why};
if(PIN.includes(t.type)){if(p.phys<t.kg)return toast('Stock from this entry is already used ('+p.phys+' kg left). Reverse the later dispatch first.',1),false;T('REV_OUT',t.lot,t.kg,o)}
else if(POUT.includes(t.type))T('REV_IN',t.lot,t.kg,o);
else if(t.type=='RESERVE'){if((p.cust[t.party]||0)<t.kg)return toast('Reservation already used',1),false;T('UNRESERVE',t.lot,t.kg,o)}
else if(t.type=='UNRESERVE')T('RESERVE',t.lot,t.kg,o);
else if(t.type=='TRANSFER')T('TRANSFER',t.lot,t.kg,{...o,from:t.to,to:t.from});
A('Reverse',t.lot,id,'',why);save();pos();return true}
function rv(id){if(revTx(id,v('rv_r'))){toast('Entry reversed');view()}}
function ed(id){const t=S.tx.find(x=>x.id==id),l=S.lots.find(x=>x.id==t.lot);if(!revTx(id,v('rv_r')))return;
if(t.type=='PURCHASE'){go('inward');const sv=(k,x)=>{const e=el(k);if(e)e.value=x==null?'':String(x)};sv('pi_s',l.supplier);sv('pi_inv',l.inv);sv('pi_d',dt(l.date));if(l.own=='Jobwork'){sv('pi_own','Jobwork');sv('pi_ow',l.owner)}if(l.outw){sv('pi_jw',l.outw);sv('pi_jp',l.outp||'Pickling')}else sv('pi_loc',l.loc);const exact=l.rate!=null&&l.own!='Jobwork';if(exact)sv('pi_f',Math.round((l.addon||0)*t.kg*100)/100);const q=PRL[0];Object.entries({p:l.product,g:l.grade,t:l.th,w:l.w,l:l.l,m:l.make,f:l.form||'Full sheet',c:l.cond||'Prime',k:t.kg,r:exact?l.rate:(l.own=='Jobwork'?'':l.cost.toFixed(2)),b:l.bundle||l.coil}).forEach(([f,x])=>sv('pr_'+q+'_'+f,x));const dp=el('pi_dup');if(dp)dp.checked=true;prJw();prTot();toast(exact||l.own=='Jobwork'?'Old entry reversed. Correct the line and post again.':'Old entry reversed. Correct the line (this older entry\'s rate includes freight – leave freight at 0) and post again.');return}
else{go('move');const m={m_a:'DISPATCH',m_l:t.lot,m_k:t.kg,m_c:t.party,m_r:t.ref};Object.entries(m).forEach(([k,x])=>{try{el(k).value=x}catch(e){}});mv()}
toast('Old entry reversed. Correct the details and post again.')}
function mrow(k,t){return `<div class="card"><b>${t}</b><div class="w"><table>${S[k].map((x,i)=>{const off=S.off[k+':'+x];return `<tr><td><input id="rn_${k}_${i}" value="${x.replace(/"/g,'&quot;')}" ${off?'disabled':''}><td>${off?'<span class="tag">Inactive</span>':''}<td><button onclick="rn('${k}',${i})">Rename</button> <button onclick="tg('${k}',${i})">${off?'Activate':'Deactivate'}</button></tr>`}).join('')}</table></div><input id="m_${k}" placeholder="Add new"><button onclick="addM('${k}','m_${k}')">Add</button></div>`}
function rn(k,i){if(!isOwner())return toast('Only the Owner can rename or deactivate',1);const o=S[k][i],n=v(`rn_${k}_${i}`);if(!n||n==o)return;if(S[k].includes(n))return toast('Name already exists',1);
renM(k,o,n);E('m',{op:'rn',k,o,n});
A('Rename',k,o,n,'Master change');save();view();toast('Renamed everywhere')}
function tg(k,i){if(!isOwner())return toast('Only the Owner can rename or deactivate',1);const x=S[k][i],key=k+':'+x;
if(!S.off[key]){if(k=='jw'&&R().some(r=>r.phys>0&&r.outw==x))return toast('Material is still out with this job worker',1);if(k=='prod'&&R().some(r=>r.phys>0&&r.product==x))return toast('There is still stock of this product',1);if(k=='locs'&&R().some(r=>r.phys>0&&r.loc==x))return toast('Stock is still in this location. Transfer it first.',1);S.off[key]=1}else delete S.off[key];
E('m',{op:'off',key,on:!!S.off[key]});A(S.off[key]?'Deactivate':'Activate',k,x,'','Master change');save();view()}
function master(){return `<h2>Items & Customers</h2><p style="color:var(--m)">Names can be changed or switched off, never deleted, so old entries stay valid. Owner only.</p>${mrow('sup','Suppliers')}${mrow('cust','Customers')}${mrow('prod','Products (CR, HR, HR CQ, …)')}${mrow('jw','Job workers (pickling units etc.)')}${mrow('locs','Warehouses / Godowns')}<div class="card"><b>Minimum stock (MT) by product</b><br>${act('prod').map(p=>`${p} <input type="number" value="${S.min[p]||0}" style="width:70px" onchange="setMin('${p}',this.value)"> `).join('')}</div>`}
function addM(k,i){const x=v(i);if(!x)return;if(S[k].includes(x))return toast('Already exists',1);S[k].push(x);E('m',{op:'add',k,x});A('Master add',k,'',x);save();view()}
function csvOut(w){const rows=w=='tx'?S.tx:filt().map(x=>({id:x.id,product:x.product,grade:x.grade,th:x.th,w:x.w,l:x.l,make:x.make,heat:x.heat,bundle:x.bundle,supplier:x.supplier,loc:x.loc,kg:x.phys,reserved:x.res,available:x.avail,cost_per_kg:x.cost.toFixed(2),value:Math.round(x.val),age:x.age,status:x.status}));
const h=Object.keys(rows[0]||{}),s=[h.join(','),...rows.map(r=>h.map(k=>'"'+String(r[k]).replace(/"/g,'""')+'"').join(','))].join('\n');
const d=document.createElement('div');d.className='card';d.innerHTML='<b>CSV – copy & paste into Excel</b><br><textarea style="width:100%;height:140px"></textarea>';d.querySelector('textarea').value=s;el('main').prepend(d);d.querySelector('textarea').select()}
const SG=window.SG||{};let sb=null,cloud=false,role='owner',replaying=false,pend=[],lastEv=0,bad=0,OR=[];const CID=Math.random().toString(36).slice(2,8);
const isOwner=()=>!cloud||role=='owner';
function emptyS(){return{lots:[],tx:[],audit:[],jobs:[],sup:[],cust:[],locs:['Main Godown'],jw:[],prod:['CR','HR','HR CQ','HRPO','GP/GI','GA','Other'],min:{},off:{}}}
function setMin(p,x){S.min[p]=+x;E('m',{op:'min',p,v:+x});A('Min stock',p,'',x);save()}
function E(kind,d){if(cloud&&!replaying)pend.push({kind,cid:CID,data:d})}
async function flush(){if(!pend.length)return;const b=pend.splice(0);const{error}=await sb.from('events').insert(b);if(error){pend.unshift(...b);mode('⚠ NOT SAVED – '+error.message,1);toast('NOT SAVED: '+error.message,1)}else mode()}
function mode(m,b){const x=el('mode');x.textContent=m||(cloud?'LIVE · '+me+' ('+role+')':'PRACTICE MODE · data stays in this browser only – do not enter real stock');x.style.background=b?'#c0392b':cloud?'var(--g)':'var(--o)';x.style.color=cloud||b?'#fff':'#000'}
function renM(k,o,n){if(k=='jw'){S.lots.forEach(l=>{if(l.outw==o){l.outw=n;l.loc='At '+n}});S.tx.forEach(t=>{if(t.to=='At '+o)t.to='At '+n;if(t.from=='At '+o)t.from='At '+n});S.jobs.forEach(j=>{if(j.worker==o){j.worker=n;j.mach=n}})}if(k=='prod'){S.lots.forEach(l=>{if(l.product==o)l.product=n});if(S.min[o]!==undefined){S.min[n]=S.min[o];delete S.min[o]}}S[k]=S[k].map(x=>x==o?n:x);if(S.off[k+':'+o]){delete S.off[k+':'+o];S.off[k+':'+n]=1}
if(k=='sup')S.lots.forEach(l=>{if(l.supplier==o)l.supplier=n});if(k=='locs')S.lots.forEach(l=>{if(l.loc==o)l.loc=n});
S.tx.forEach(t=>{if((k=='sup'||k=='cust')&&t.party==o)t.party=n;if(k=='locs'){if(t.to==o)t.to=n;if(t.from==o)t.from=n}})}
function apply(e){const d=e.data,k=e.kind;
if(k=='lot'){if(S.lots.some(l=>l.id==d.id))return bad++;S.lots.push(d)}else if(k=='tx'){if(S.tx.some(t=>t.id==d.id))return bad++;S.tx.push(d)}
else if(k=='audit')S.audit.push(d);else if(k=='job')S.jobs.push(d);
else if(k=='m'){if(d.op=='add'){if(!S[d.k].includes(d.x))S[d.k].push(d.x)}else if(d.op=='rn')renM(d.k,d.o,d.n);else if(d.op=='off'){if(d.on)S.off[d.key]=1;else delete S.off[d.key]}else if(d.op=='min')S.min[d.p]=d.v}}
async function pull(){const{data,error}=await sb.from('events').select('id,kind,cid,data').gt('id',lastEv).order('id').limit(1000);if(error){mode('⚠ Sync error: '+error.message,1);return 0}
let ch=0;replaying=true;data.forEach(e=>{lastEv=e.id;if(e.cid==CID)return;apply(e);ch++});replaying=false;
if(data.length==1000)ch+=await pull();if(bad)mode('⚠ '+bad+' entries clashed on ID – tell the admin, reload the page',1);return ch}
function initCloud(){mode('Connecting…');const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onerror=()=>mode('Cannot load sign-in library',1);

async function start(ss){cloud=true;S=emptyS();const{data:p}=await sb.from('profiles').select('role,name').eq('id',ss.user.id).single();role=(p&&p.role)||'management';me=(p&&p.name)||ss.user.email;

const pnN=t=>String(t||'').toUpperCase().replace(/[\s\-_]/g,''),PAL={GP:'GP/GI',GI:'GP/GI',GALVANISED:'GP/GI',GALVANIZED:'GP/GI'};
function pnm(x){const n=pnN(x);return act('prod').find(p=>pnN(p)==n)||(PAL[n]&&act('prod').find(p=>p==PAL[n]))}
function pd(s){s=(s||'').trim();if(!s)return NOW;const m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/),d=m?new Date(+m[3],m[2]-1,+m[1]):/^\d{4}-\d{2}-\d{2}$/.test(s)?new Date(s):null;return d&&!isNaN(d)&&d.getTime()<=NOW?d.getTime():NaN}
function openV(){return `<h2>Opening stock – paste from Excel</h2><div class="card"><p>Copy rows from Excel and paste below. Columns, in this order (header row optional):<br><b>Product | Grade | Thickness mm | Width mm | Length mm | Make | Weight in KG | Cost ₹/kg | Godown | Received date DD-MM-YYYY (optional) | Supplier (optional) | Form (optional: CTL or blank) | Customer (ONLY for jobwork material: customer name, cost can be blank) | Condition (optional: Rusted / Damaged / Hold, blank = Prime) | With job worker now (optional: name of the pickling unit etc.)</b><br><small>Weight must be in kg (10 MT = 10000; 45 kg = 45), small quantities are fine. Cost is your landed cost per kg. If you don't know the received date, give your best estimate – it drives the ageing report. Length 0 = coil.</small></p><textarea id="o_t" style="width:100%;height:200px"></textarea><br><button class="p" onclick="oCheck()">Check rows</button><div id="o_r"></div></div>`}
function oCheck(){OR=[];v('o_t').split('\n').filter(x=>x.trim()).forEach((ln,i)=>{const c=ln.replace(/\r/,'').split(ln.includes('\t')?'\t':',').map(x=>x.trim());

if(i==0&&!pr&&isNaN(th))return;if(!pr)e.push('Product "'+(c[0]||'')+'" is not in the list – add it under Items & Customers first (existing: '+act('prod').join(', ')+')');if(!(th>0))e.push('Thickness');if(!(w>0))e.push('Width');if(!(kg>0))e.push('Weight');if(!c[12]&&!(co>0))e.push('Cost');if(!c[5])e.push('Make');if(isNaN(dd))e.push('Date');
OR.push({jwk:(c[14]||'').trim(),cond:/rust/i.test(c[13]||'')?'Rusted':/damag/i.test(c[13]||'')?'Damaged':/hold/i.test(c[13]||'')?'Hold':'Prime',jw:!!c[12],owner:c[12]||'',form:/ctl|cut|process/i.test(c[11]||'')?'CTL':'Full sheet',warn:kg>0&&kg<100,n:i+1,pr,g:c[1]||'',th,w,l,mk:c[5]||'',kg,co,loc:c[8]||S.locs[0],date:dd,sup:c[10]||'Opening stock',e})});
const kg=OR.reduce((a,r)=>a+(r.kg||0),0),val=OR.reduce((a,r)=>a+(r.kg*r.co||0),0),b=OR.filter(r=>r.e.length).length;
el('o_r').innerHTML=`<p><b>${OR.length}</b> rows · ${mt(kg)} MT · cost ${inr(val)} · <b style="color:var(--${b?'r':'g'})">${b?b+' rows need fixing – correct them in Excel and paste again':'all rows OK'}</b></p><div class="w"><table><tr><th>#<th>Product<th>Form<th>Owner<th>Grade<th>Thickness (mm)<th>Width×Length (mm)<th>Make<th class=n>kg<th class=n>₹/kg<th>Godown<th>Received<th>Check</tr>${OR.map(r=>`<tr><td>${r.n}<td>${r.pr||'?'}<td>${r.form}${r.cond!='Prime'?' · '+r.cond:''}<td>${r.jw?'Jobwork: '+r.owner:'Own'}${r.jwk?' · at '+r.jwk:''}<td>${r.g}<td>${r.th}<td>${r.w}×${r.l}<td>${r.mk}<td class=n>${r.kg}<td class=n>${r.co}<td>${r.loc}<td>${isNaN(r.date)?'?':dt(r.date)}<td style="color:var(--${r.e.length?'r':'g'})">${r.e.length?r.e.join(', '):r.warn?'OK (small: '+r.kg+' kg – is that kg?)':'OK'}</tr>`).join('')}</table></div>${!b&&OR.length?(S.tx.some(t=>t.type=='OPENING')?'<label><input type="checkbox" id="o_c"> Opening stock was already posted – post again (this ADDS to stock)</label><br>':'')+`<button class="p" onclick="oPost()">Post ${OR.length} rows as opening stock</button>`:''}`}
function oPost(){if(!OR.length||OR.some(r=>r.e.length))return toast('Fix the errors first',1);if(S.tx.some(t=>t.type=='OPENING')&&!(el('o_c')&&el('o_c').checked))return toast('Tick the box to confirm posting again',1);
OR.forEach(r=>{if(r.jwk&&!S.jw.includes(r.jwk)){S.jw.push(r.jwk);E('m',{op:'add',k:'jw',x:r.jwk})}if(!r.jwk&&!S.locs.includes(r.loc)){S.locs.push(r.loc);E('m',{op:'add',k:'locs',x:r.loc})}if(r.jw&&!S.cust.includes(r.owner)){S.cust.push(r.owner);E('m',{op:'add',k:'cust',x:r.owner})}if(!r.jw&&!S.sup.includes(r.sup)){S.sup.push(r.sup);E('m',{op:'add',k:'sup',x:r.sup})}

A('Opening stock',OR.length+' lines',0,OR.reduce((a,r)=>a+r.kg,0)+' kg','Day-0 import');const n=OR.length;OR=[];save();pos();toast(n+' opening lines posted');go('stock')}
