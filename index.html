.ag3{margin:6px 0 18px}.ag3 h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:15px}.ag3 h3 small{font-weight:400}.ar{display:flex;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--b)}.ar:last-child{border:0}.ar span.m{flex:1;min-width:0;overflow-wrap:anywhere}.ar button{flex:none;white-space:nowrap}

<script>
const D=864e5,NOW=Date.now(),K='sg_inv_v2';
const PIN=['OPENING','PURCHASE','PROC_OUT','ADJ_IN','CUST_RETURN','REV_IN','RECLASS_IN'],POUT=['DISPATCH','PROC_IN','SCRAP','ADJ_OUT','SUPP_RETURN','REV_OUT','RECLASS_OUT'];
let S=null,me='Admin',tab='mgmt',F={q:'',pred:null,label:''},sel=null,P={},grp='product';
const el=i=>document.getElementById(i),v=i=>el(i).value.trim(),nv=i=>parseFloat(el(i).value)||0;
const mt=k=>(k/1000).toFixed(2),pad=(x,l)=>String(x).padStart(l,'0');
const inr=x=>'₹'+(Math.abs(x)>=1e7?(x/1e7).toFixed(2)+' Cr':Math.abs(x)>=1e5?(x/1e5).toFixed(2)+' L':Math.round(x).toLocaleString('en-IN'));
const dt=t=>new Date(t).toISOString().slice(0,10);
function save(){if(cloud){flush();return}try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function toast(m,bad){const t=el('toast');t.textContent=m;t.style.background=bad?'#d92d20':'#248a3d';t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function T(type,lot,kg,o={}){const t=({id:'T'+pad(S.tx.length+1,5),ts:o.ts||Date.now(),type,lot,kg,from:o.from||'',to:o.to||'',party:o.party||'',ref:o.ref||'',user:me,rem:o.rem||'',rev:o.rev||''});S.tx.push(t);E('tx',t)}
function A(act,obj,o,nw,why){const a={ts:Date.now(),user:me,act,obj,old:o??'',nw:nw??'',why:why||''};S.audit.push(a);E('audit',a)}
function pos(){P={};S.lots.forEach(l=>P[l.id]={phys:0,res:0,last:0,loc:l.loc,cust:{}});
S.tx.forEach(t=>{const p=P[t.lot];if(!p)return;
if(PIN.includes(t.type))p.phys+=t.kg;else if(POUT.includes(t.type))p.phys-=t.kg;
else if(t.type=='RESERVE'){p.res+=t.kg;p.cust[t.party]=(p.cust[t.party]||0)+t.kg}
else if(t.type=='UNRESERVE'){p.res-=t.kg;p.cust[t.party]=(p.cust[t.party]||0)-t.kg}
else if(t.type=='TRANSFER')p.loc=t.to;
if(t.ts>p.last)p.last=t.ts})}
const LAB=l=>`${l.product} ${l.grade||''}`.replace(/\s+/g,' ').trim()+' | '+l.th+'MMx'+l.w+'MM'+(l.l?'x'+l.l+'MM':' (coil)')+' | '+l.make+((l.form||'')=='CTL'?' CTL':'');
function R(){return S.lots.map(l=>{const p=P[l.id],avail=p.phys-p.res;return{...l,...p,avail,age:Math.floor((NOW-l.date)/D),idle:Math.floor((NOW-p.last)/D),val:p.phys*l.cost,sellv:p.phys*(l.sell||l.cost*1.06),lab:LAB(l),form:l.form||'Full sheet',cond:l.cond||'Prime',own:l.own||'Own',owner:l.owner||'',sku:[l.product,l.grade,l.th,l.w,l.l,l.make,l.form=='CTL'?'CTL':''].join(' ').trim(),
status:p.phys<0?'NEGATIVE':p.phys==0?'Dispatched':p.res>0&&avail<=0?'Reserved':p.res>0?'Part-reserved':'Available'}})}
const MK0=['Tata','JSW','AM/NS','Bokaro New Mill','Bokaro Old Mill'],MKA={'new mill':'Bokaro New Mill','old mill':'Bokaro Old Mill','bokaro new':'Bokaro New Mill','bokaro old':'Bokaro Old Mill','amns':'AM/NS','am ns':'AM/NS','am/ns':'AM/NS','tata steel':'Tata'};const MKM={};MK0.forEach(m=>MKM[m.toLowerCase()]=m);
function cmk(m){m=String(m==null?'':m).replace(/\s+/g,' ').trim();if(!m)return '';const k=m.toLowerCase();if(MKA[k])return MKA[k];if(!MKM[k])MKM[k]=m;return MKM[k]}
function addLot(o){if(o&&o.make!=null)o.make=cmk(o.make);const id='L'+pad(S.lots.length+1,3);const lot={id,form:'Full sheet',cond:'Prime',type:'bundle',grade:'',coil:'',heat:'',bundle:'',sheets:0,parent:'',...o};S.lots.push(lot);E('lot',lot);return id}
function demo(){S=emptyS();save()}
function res(lot,party,kg,ago){T('RESERVE',lot,kg,{party,ts:ago?NOW-ago*D:0});pos()}
function disp(lot,party,kg,ago){const o={party,ts:ago?NOW-ago*D:0,ref:'INV-'+pad(S.tx.length+1,4)};const rc=(P[lot].cust[party]||0);if(rc>0)T('UNRESERVE',lot,Math.min(kg,rc),o);T('DISPATCH',lot,kg,o);pos()}
function boot(){if(SG.url&&SG.key)return initCloud();try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)demo();S.off=S.off||{};S.jw=S.jw||[];S.prod=S.prod||['CR','HR','HR CQ','HRPO','GP/GI','GA','Other'];pos();nav();mode()}
const TABS=[['mgmt','Management'],['stock','Stock'],['find','What do I have?'],['inward','Inward'],['move','Reserve / Dispatch / Transfer'],['proc','Processing'],['recon','Reconcile'],['age','Ageing & Valuation'],['alerts','Alerts'],['ledger','Ledger & Audit'],['master','Masters']];
function go(t){tab=t;nav()}
function view(){pos();el('main').innerHTML=({mgmt,stock,find,inward,move,proc,recon,age,alerts:alertsV,ledger,master,open:openV,jw:jwV,cond:condV,jo:joV,pur:()=>regPage('p'),hist:histPage,sal:()=>regPage('d')})[tab]()}
function opt(a,s){return a.map(x=>`<option ${x==s?'selected':''}>${x}</option>`).join('')}
const LP={};

function openV(){return `<h2>Opening stock – paste from Excel</h2><div class="card"><p>Copy rows from Excel and paste below. Columns, in this order (header row optional):<br><b>Product | Grade | Thickness mm | Width mm | Length mm | Make | Weight in KG | Cost ₹/kg | Godown | Received date DD-MM-YYYY (optional) | Supplier (optional) | Form (optional: CTL or blank) | Customer (ONLY for jobwork material: customer name, cost can be blank) | Condition (optional: Rusted / Damaged / Hold, blank = Prime) | With job worker now (optional: name of the pickling unit etc.)</b><br><small>Weight must be in kg (10 MT = 10000; 45 kg = 45), small quantities are fine. Cost is your landed cost per kg. If you don't know the received date, give your best estimate – it drives the ageing report. Length 0 = coil.</small></p><textarea id="o_t" style="width:100%;height:200px"></textarea><br><button class="p" onclick="oCheck()">Check rows</button><div id="o_r"></div></div>`}
function oCheck(){OR=[];v('o_t').split('\n').filter(x=>x.trim()).forEach((ln,i)=>{const c=ln.replace(/\r/,'').split(ln.includes('\t')?'\t':',').map(x=>x.trim());
const pr=pnm(c[0]),th=parseFloat(c[2]),w=parseFloat(c[3]),l=parseFloat(c[4])||0,kg=parseFloat(c[6]),co=parseFloat(c[7]),dd=pd(c[9]),e=[];
if(i==0&&!pr&&isNaN(th))return;if(!pr)e.push('Product "'+(c[0]||'')+'" is not in the list – add it under Items & Customers first (existing: '+act('prod').join(', ')+')');if(!(th>0))e.push('Thickness');if(!(w>0))e.push('Width');if(!(kg>0))e.push('Weight');if(!c[12]&&!(co>0))e.push('Cost');if(!c[5])e.push('Make');if(isNaN(dd))e.push('Date');
OR.push({jwk:(c[14]||'').trim(),cond:/rust/i.test(c[13]||'')?'Rusted':/damag/i.test(c[13]||'')?'Damaged':/hold/i.test(c[13]||'')?'Hold':'Prime',jw:!!c[12],owner:c[12]||'',form:/ctl|cut|process/i.test(c[11]||'')?'CTL':'Full sheet',warn:kg>0&&kg<100,n:i+1,pr,g:c[1]||'',th,w,l,mk:cmk(c[5]),kg,co,loc:c[8]||S.locs[0],date:dd,sup:c[10]||'Opening stock',e})});
const kg=OR.reduce((a,r)=>a+(r.kg||0),0),val=OR.reduce((a,r)=>a+(r.kg*r.co||0),0),b=OR.filter(r=>r.e.length).length;
el('o_r').innerHTML=`<p><b>${OR.length}</b> rows · ${mt(kg)} MT · cost ${inr(val)} · <b style="color:var(--${b?'r':'g'})">${b?b+' rows need fixing – correct them in Excel and paste again':'all rows OK'}</b></p><div class="w"><table><tr><th>#<th>Product<th>Form<th>Owner<th>Grade<th>Thickness (mm)<th>Width×Length (mm)<th>Make<th class=n>kg<th class=n>₹/kg<th>Godown<th>Received<th>Check</tr>${OR.map(r=>`<tr><td>${r.n}<td>${r.pr||'?'}<td>${r.form}${r.cond!='Prime'?' · '+r.cond:''}<td>${r.jw?'Jobwork: '+r.owner:'Own'}${r.jwk?' · at '+r.jwk:''}<td>${r.g}<td>${r.th}<td>${r.w}×${r.l}<td>${r.mk}<td class=n>${r.kg}<td class=n>${r.co}<td>${r.loc}<td>${isNaN(r.date)?'?':dt(r.date)}<td>${r.e.length?`<span class="tag err">Fix: ${r.e.join(', ')}</span>`:r.warn?`<span class="tag warn">Check: only ${r.kg} kg – is that in kg?</span>`:'<span class="tag ok">OK</span>'}</tr>`).join('')}</table></div>${!b&&OR.length?(S.tx.some(t=>t.type=='OPENING')?'<label><input type="checkbox" id="o_c"> Opening stock was already posted – post again (this ADDS to stock)</label><br>':'')+`<button class="p" onclick="oPost()">Post ${OR.length} rows as opening stock</button>`:''}`}
function oPost(){if(!OR.length||OR.some(r=>r.e.length))return toast('Fix the errors first',1);if(S.tx.some(t=>t.type=='OPENING')&&!(el('o_c')&&el('o_c').checked))return toast('Tick the box to confirm posting again',1);
OR.forEach(r=>{if(r.jwk&&!S.jw.includes(r.jwk)){S.jw.push(r.jwk);E('m',{op:'add',k:'jw',x:r.jwk})}if(!r.jwk&&!S.locs.includes(r.loc)){S.locs.push(r.loc);E('m',{op:'add',k:'locs',x:r.loc})}if(r.jw&&!S.cust.includes(r.owner)){S.cust.push(r.owner);E('m',{op:'add',k:'cust',x:r.owner})}if(!r.jw&&!S.sup.includes(r.sup)){S.sup.push(r.sup);E('m',{op:'add',k:'sup',x:r.sup})}
const id=addLot({product:r.pr,grade:r.g,th:r.th,w:r.w,l:r.l,make:r.mk,supplier:r.jw?r.owner:r.sup,inv:'OPENING',date:r.date,loc:r.jwk?'At '+r.jwk:r.loc,...(r.jwk?{outw:r.jwk,outp:'Pickling',outd:r.date}:{}),cost:r.jw?0:r.co,type:r.l?'bundle':'coil',form:r.form,cond:r.cond,own:r.jw?'Jobwork':'Own',owner:r.owner});T('OPENING',id,r.kg,{ts:r.date+1,to:r.jwk?'At '+r.jwk:r.loc,party:r.sup,ref:'OPENING',rem:'Day-0 opening stock'})});
A('Opening stock',OR.length+' lines',0,OR.reduce((a,r)=>a+r.kg,0)+' kg','Day-0 import');const n=OR.length;OR=[];save();pos();toast(n+' opening lines posted');go('stock')}
boot();
</script></body></html>
